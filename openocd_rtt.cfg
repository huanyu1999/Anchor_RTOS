# =============================================================================
# OpenOCD config: ST-Link V3 MiniE + STM32F405 + SEGGER RTT
# Usage:
#   openocd -f openocd_rtt.cfg
#   (另开终端)  telnet 127.0.0.1 9090
# 要求：OpenOCD >= 0.11（建议 0.12+，对 ST-Link V3 支持更好）
# =============================================================================

# ST-Link V3 走 DAP 直连（V3 推荐，速率/稳定性优于传统 hla）
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter speed 1800

# STM32F4 目标
source [find target/stm32f4x.cfg]

init

# 一次性 reset 并放行（不要 halt），让 main() 里的 SEGGER_RTT_Init 真正执行
reset run

# 给程序 ~300ms 跑过 HAL_Init / SystemClock_Config / SEGGER_RTT_Init
sleep 300

# -----------------------------------------------------------------------------
# RTT 控制块搜索：STM32F405 主 SRAM = 0x20000000，长度 128KB = 0x20000
# 切勿包含 CCM（0x10000000），ST-Link 无法通过 AHB 访问 CCM
# ID 字符串必须与 SEGGER_RTT.c 内部一致（默认 "SEGGER RTT"）
# -----------------------------------------------------------------------------
rtt setup 0x20000000 0x20000 "SEGGER RTT"
rtt polling_interval 100
rtt start

# 通道 0 转发到 TCP 9090（telnet 端口）
rtt server start 9090 0
